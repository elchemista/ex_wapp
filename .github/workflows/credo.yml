name: Credo

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: credo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credo:
    if: github.event.pull_request.merged == true
    name: Static code analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "28.x"
          elixir-version: "1.19.x"

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix credo --strict
