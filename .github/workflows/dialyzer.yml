name: Dialyzer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dialyzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialyzer:
    name: Type analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29.x"
          elixir-version: "1.20.x"

      - name: Restore Mix and PLT cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.mix
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get --only test --check-locked

      - name: Run Dialyzer
        run: mix dialyzer --format github
