[package]
name = "ex_wapp_nif"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.0"
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
hkdf = "0.12"
prost = "0.14"
rand = "0.9"
sha2 = "0.10"
thiserror = "2.0"
waproto = { path = "../../whatsapp-rust/waproto" }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
