[package]
name = "signal_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "signal_nif"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "debug_signal"
path = "src/bin/debug_signal.rs"

[dependencies]
rustler = "0.36"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto dependencies (same as wacore-libsignal)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = { version = "0.12", features = ["reset"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = { version = "4.1", features = ["digest"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
getrandom = "0.2"
subtle = "2.4"
hex = "0.4"
prost = "0.13"

[build-dependencies]
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = true
